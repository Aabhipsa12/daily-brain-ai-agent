name: Daily Brain CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -----------------------------------------------------------
  # 1. Automated Quality & Unit Testing
  # -----------------------------------------------------------
  test-and-lint:
    name: Core Agent Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint Syntax Checks
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Core Agent Unit Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify Web / PWA Static Assets
        run: |
          python -c "
          import os
          req = ['manifest.json', 'sw.js', 'offline.html', 'icon-192.png', 'icon-512.png', 'apple-touch-icon.png', 'favicon.ico']
          missing = [f for f in req if not os.path.exists(os.path.join('static', f))]
          if missing:
              raise SystemExit(f'Missing PWA assets: {missing}')
          print('All PWA assets verified successfully!')
          "

  # -----------------------------------------------------------
  # 2. Windows Desktop Standalone Build
  # -----------------------------------------------------------
  build-windows-desktop:
    name: Build Windows Desktop App
    needs: test-and-lint
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywebview

      - name: Build Desktop Executable
        run: |
          python build_desktop.py

      - name: Upload Windows Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DailyBrain-Windows-Desktop
          path: dist/DailyBrain/
          retention-days: 14

  # -----------------------------------------------------------
  # 3. Android APK Build Pipeline
  # -----------------------------------------------------------
  build-android-apk:
    name: Build Android APK
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.2.2"

      - name: Build Android Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DailyBrain-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
