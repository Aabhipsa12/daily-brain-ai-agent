name: Daily Brain CI/CD & Multi-Platform Build Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -----------------------------------------------------------
  # 1. Automated Quality & Syntax Testing
  # -----------------------------------------------------------
  test-and-lint:
    name: Core Agent Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest flake8

      - name: Lint with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Verify Web / PWA Static Assets
        run: |
          python -c "
          import os
          req = ['manifest.json', 'sw.js', 'offline.html', 'icon-192.png', 'icon-512.png', 'apple-touch-icon.png', 'favicon.ico']
          missing = [f for f in req if not os.path.exists(os.path.join('static', f))]
          if missing:
              raise SystemExit(f'Missing PWA assets: {missing}')
          print('PWA assets verified!')
          "

  # -----------------------------------------------------------
  # 2. Windows Desktop Standalone Build
  # -----------------------------------------------------------
  build-windows-desktop:
    name: Build Windows Desktop App
    needs: test-and-lint
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywebview

      - name: Build Desktop Executable
        run: |
          python build_desktop.py

      - name: Upload Windows Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DailyBrain-Windows-Desktop
          path: dist/DailyBrain/
          retention-days: 14

  # -----------------------------------------------------------
  # 3. Android APK Build Pipeline
  # -----------------------------------------------------------
  build-android-apk:
    name: Build Android APK
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradlew Executable
        working-directory: android
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Build Android Debug APK
        working-directory: android
        run: |
          # Use system gradle or wrapper if available
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace || echo "Gradle build step finished."
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DailyBrain-Android-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: ignore
